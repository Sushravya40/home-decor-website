<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Home Decor</title>
    <link href="common.css" rel="stylesheet">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 80px auto;
            padding: 50px;
            background: var(--white);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.8s ease-out;
            border: 1px solid rgba(0,0,0,0.05);
            text-align: center;
        }

        .avatar {
            width: 150px;
            height: 150px;
            background-color: var(--primary);
            color: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            font-weight: 700;
            margin-bottom: 25px;
            box-shadow: 0 10px 20px rgba(212, 163, 115, 0.3);
        }

        .profile-name {
            font-size: 36px;
            color: var(--text-main);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .profile-email {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .profile-stats {
            display: flex;
            gap: 40px;
            margin-bottom: 40px;
            width: 100%;
            justify-content: center;
        }

        .stat-box {
            background: #fafafa;
            padding: 20px 40px;
            border-radius: 16px;
            border: 1px solid #eee;
            transition: var(--transition);
        }

        .stat-box:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-sm);
        }

        .stat-num {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logout-btn {
            padding: 15px 40px;
            background-color: transparent;
            color: #ff6b6b;
            border: 2px solid #ff6b6b;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .logout-btn:hover {
            background-color: #ff6b6b;
            color: var(--white);
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <nav class="nav">
        <div class="homediv">
            <div class="lag">
                <p><b>𝐻𝑜𝓂𝑒𝒟𝑒𝒸𝑜𝓇</b></p>
            </div>
            <div class="menu">
                <a class="divv" href="homepage.html">Home</a>
                <a class="divv" href="categories.html">Categories</a>
                <a class="divv" href="products.html">Product</a>
                <a class="divv" href="about.html">About</a>
                <a class="divv" href="contact.html">Contact</a>
                <a class="divv" href="cart.html">Cart</a>
                <a class="divv" id="sign" href="loginpage.html">Sign In</a>
            </div>
        </div>
    </nav>

    <div class="profile-container">
        <div class="avatar">U</div>
        <h2 class="profile-name">Welcome, User!</h2>
        <p class="profile-email" id="profile-email-text">user@example.com</p>

        <div class="profile-stats">
            <div class="stat-box">
                <div class="stat-num" id="cart-stat">0</div>
                <div class="stat-label">Items in Cart</div>
            </div>
            <div class="stat-box">
                <div class="stat-num">0</div>
                <div class="stat-label">Past Orders</div>
            </div>
        </div>

        <button class="logout-btn" onclick="logout()">Log Out</button>
    </div>

    <footer class="foot">
        <div class="foordiv">
            <p>@ Made with Love</p>
        </div>
    </footer>

    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check auth status to ensure page protection
            if (localStorage.getItem('isLoggedIn') !== 'true') {
                window.location.href = 'loginpage.html';
            }

            // Load username & email
            const uname = localStorage.getItem('username') || 'User';
            const email = localStorage.getItem('email') || 'user@example.com';
            
            document.querySelector('.profile-name').innerText = 'Welcome, ' + uname + '!';
            document.getElementById('profile-email-text').innerText = email;
            document.querySelector('.avatar').innerText = uname.charAt(0).toUpperCase();

            // Load actual cart stat
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            document.getElementById('cart-stat').innerText = cart.length;
        });

        function logout() {
            localStorage.removeItem('isLoggedIn');
            window.location.href = 'homepage.html';
        }
    </script>
</body>

</html>
