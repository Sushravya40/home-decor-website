<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Home Decor</title>
    <link href="common.css" rel="stylesheet">
    <style>
        .cart-container {
            max-width: 900px;
            margin: 80px auto;
            padding: 40px;
            background: var(--white);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            min-height: 400px;
            border: 1px solid rgba(0,0,0,0.05);
            animation: fadeIn 0.8s ease-out;
        }

        .cart-header {
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h2 {
            font-size: 32px;
            color: var(--text-main);
            font-weight: 700;
        }

        #item-count {
            font-size: 18px;
            color: var(--text-muted);
            background: #f5f5f5;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
        }

        .cart-item {
            display: flex;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
            transition: var(--transition);
        }

        .cart-item:hover {
            background: #fafafa;
            border-radius: 10px;
            padding: 20px 10px;
        }

        .cart-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 12px;
            margin-right: 25px;
            box-shadow: var(--shadow-sm);
        }

        .item-details {
            flex-grow: 1;
        }

        .item-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .item-price {
            color: var(--primary);
            font-weight: 700;
            font-size: 18px;
        }

        .remove-btn {
            color: #ff6b6b;
            cursor: pointer;
            border: none;
            background: rgba(255, 107, 107, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            transition: var(--transition);
        }

        .remove-btn:hover {
            background: #ff6b6b;
            color: var(--white);
        }

        .cart-summary {
            margin-top: 40px;
            text-align: right;
            border-top: 2px solid #eee;
            padding-top: 30px;
        }

        .total-price {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 25px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
        }

        #cart-total {
            color: var(--primary);
            font-size: 32px;
        }

        .cart-actions {
            display: flex;
            gap: 20px;
            justify-content: flex-end;
        }

        .btn {
            padding: 15px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            border: none;
            transition: var(--transition);
        }

        .primary-btn {
            background-color: var(--primary);
            color: var(--white);
            box-shadow: 0 10px 20px rgba(212, 163, 115, 0.3);
        }

        .primary-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(212, 163, 115, 0.4);
        }

        .secondary-btn {
            background-color: transparent;
            border: 2px solid var(--text-main);
            color: var(--text-main);
        }

        .secondary-btn:hover {
            background-color: var(--text-main);
            color: var(--white);
        }

        .empty-cart {
            text-align: center;
            padding: 80px 0;
            color: var(--text-muted);
        }

        .empty-cart p {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 300;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <nav class="nav">
        <div class="homediv">
            <div class="lag">
                <p><b>𝐻𝑜𝓂𝑒𝒟𝑒𝒸𝑜𝓇</b></p>
            </div>
            <div class="menu">
                <a class="divv" href="homepage.html">Home</a>
                <a class="divv" href="categories.html">Categories</a>
                <a class="divv" href="products.html">Product</a>
                <a class="divv" href="about.html">About</a>
                <a class="divv" href="contact.html">Contact</a>
                <a class="divv" href="cart.html">Cart</a>
                <a class="divv" id="sign" href="loginpage.html">Sign In</a>
            </div>
        </div>
    </nav>

    <div class="cart-container">
        <div class="cart-header">
            <h2>Your Shopping Cart</h2>
            <span id="item-count">0 Items</span>
        </div>

        <div id="cart-items">
            <!-- Items will be injected here via JS -->
        </div>

        <div class="cart-summary" id="cart-summary" style="display: none;">
            <div class="total-price">Total: <span id="cart-total">₹0</span></div>
            <div class="cart-actions">
                <a href="products.html" class="btn secondary-btn">Continue Shopping</a>
                <button class="btn primary-btn" onclick="alert('Checkout functionality coming soon!')">Checkout</button>
            </div>
        </div>

        <div id="empty-cart-msg" class="empty-cart">
            <p>Your cart is empty.</p>
            <br>
            <a href="products.html" class="btn primary-btn">Start Shopping</a>
        </div>
    </div>

    <footer class="foot">
        <div class="foordiv">
            <p>@ Made with Love</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadCart();
        });

        function loadCart() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartItemsContainer = document.getElementById('cart-items');
            const cartSummary = document.getElementById('cart-summary');
            const emptyCartMsg = document.getElementById('empty-cart-msg');
            const itemCount = document.getElementById('item-count');

            cartItemsContainer.innerHTML = '';

            if (cart.length === 0) {
                cartSummary.style.display = 'none';
                emptyCartMsg.style.display = 'block';
                itemCount.innerText = '0 Items';
                return;
            }

            cartSummary.style.display = 'block';
            emptyCartMsg.style.display = 'none';
            itemCount.innerText = `${cart.length} Item${cart.length !== 1 ? 's' : ''}`;

            let total = 0;

            cart.forEach((item, index) => {
                // Sanitize price (remove currency symbol and commas if they exist, though we should store clean numbers preferably)
                // Assuming price is stored as string "₹45,000" or number. 
                // Let's try to parse it safely.
                let priceVal = 0;
                if (typeof item.price === 'string') {
                    priceVal = parseFloat(item.price.replace(/[^0-9.]/g, ''));
                } else {
                    priceVal = item.price;
                }
                total += priceVal;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <img src="${item.img}" alt="${item.title}">
                    <div class="item-details">
                        <div class="item-title">${item.title}</div>
                        <div class="item-price">${item.price}</div>
                    </div>
                    <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                `;
                cartItemsContainer.appendChild(itemDiv);
            });

            document.getElementById('cart-total').innerText = '₹' + total.toLocaleString('en-IN');
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }
    </script>
    <script src="common.js"></script>
</body>

</html>
