<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Home Decor</title>
    <link href="common.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <div class="login-wrapper">
        <form class="container">
            <h2>Create Account</h2>

            <div class="input-group">
                <label for="name">Username</label>
                <input type="text" class="input" name="name" id="name" placeholder="Enter Username" required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" class="input" name="email" id="email" placeholder="Enter Email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" class="input" name="password" id="password" placeholder="Create Password"
                    pattern="^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[&%$#@!])[A-Za-z\d&%$#@!]{8,}$" required>
            </div>

            <div class="cmt">
                <strong>Password Requirements:</strong>
                <ul>
                    <li>Min 8 characters</li>
                    <li>One uppercase & lowercase</li>
                    <li>One digit & special char</li>
                </ul>
            </div>

            <div class="actions">
                <a href="homepage.html" class="back-link">← Back to Home</a>
                <button type="button" class="submit-btn" onclick="const uname=document.getElementById('name').value; const email=document.getElementById('email').value; if(uname){localStorage.setItem('username', uname);} if(email){localStorage.setItem('email', email);} localStorage.setItem('isLoggedIn', 'true'); window.location.href='profile.html'">Sign Up</button>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <a href="loginpage.html" style="color: var(--white); text-decoration: none; font-size: 14px;">Already have an account? <b>Sign In</b></a>
            </div>
        </form>
    </div>

    <script src="common.js"></script>
</body>

</html>
